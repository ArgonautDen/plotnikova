<title>Плотникова Галина Романовна — ветеринарный врач-терапевт</title>
<meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%;background:#22090e}</style>
<script>
  // Site root: pick the language version from the browser. Relative URLs keep
  // working under the GitHub Pages base path (/plotnikova/) and at the domain root.
  (function () {
    var langs = navigator.languages || [navigator.language || ""];
    var ru = langs.some(function (l) { return /^ru\b/i.test(l); });
    location.replace(ru ? "./ru/" : "./en/");
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=./ru/"></noscript>
</head>
